
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TERRITORY</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #101318;
  color: white;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}
header {
  padding: 18px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
h1 { margin: 0; font-size: 25px; letter-spacing: 3px; }
.status { color: #a6ef39; font-size: 12px; }
#map { width: 100%; height: 55vh; min-height: 350px; }
.panel { padding: 18px 20px 28px; }
.stats { display: flex; gap: 9px; margin-bottom: 18px; }
.stat {
  flex: 1;
  background: #1c222b;
  padding: 12px 8px;
  border-radius: 12px;
}
.stat-label { color: #929ba8; font-size: 10px; margin-bottom: 6px; }
.stat-value { font-size: 18px; font-weight: 700; }
button {
  width: 100%;
  border: 0;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 10px;
  font-size: 16px;
  font-weight: 700;
}
button:disabled { opacity: .4; }
.primary { background: #a6ef39; color: #111; }
.secondary { background: #303844; color: white; }
.message {
  min-height: 22px;
  color: #a6ef39;
  font-size: 13px;
  text-align: center;
  margin-top: 5px;
}
</style>
</head>

<body>
<header>
  <h1>TERRITORY</h1>
  <div class="status" id="gpsStatus">GPS 未接続</div>
</header>

<div id="map"></div>

<section class="panel">
  <div class="stats">
    <div class="stat">
      <div class="stat-label">DISTANCE</div>
      <div class="stat-value" id="distance">0 m</div>
    </div>
    <div class="stat">
      <div class="stat-label">AREA</div>
      <div class="stat-value" id="area">0 ㎡</div>
    </div>
    <div class="stat">
      <div class="stat-label">TERRITORIES</div>
      <div class="stat-value" id="territories">0</div>
    </div>
  </div>

  <button class="primary" id="startButton">WALK START</button>
  <button class="secondary" id="finishButton" disabled>WALK FINISH</button>
  <button class="primary" id="claimButton" disabled>CLAIM TERRITORY</button>
  <div class="message" id="message">
    位置情報を許可してWALK STARTを押してください
  </div>
</section>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const map = L.map("map").setView([35.6812,139.7671],16);

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 19,
    attribution: "&copy; OpenStreetMap contributors"
  }
).addTo(map);

let marker = null;
let accuracyCircle = null;
let routeLine = null;
let territoryLayer = null;
let watchId = null;
let recording = false;
let closed = false;
let route = [];
let totalDistance = 0;
let territoryCount = 0;
let currentArea = 0;

const MIN_DISTANCE = 300;
const CLOSE_DISTANCE = 40;
const MAX_ACCURACY = 35;
const MIN_POINTS = 5;

const $ = id => document.getElementById(id);

function message(text) {
  $("message").textContent = text;
}

function distance(a,b) {
  const R = 6371000;
  const rad = Math.PI / 180;
  const p1 = a.lat * rad;
  const p2 = b.lat * rad;
  const dp = (b.lat-a.lat) * rad;
  const dl = (b.lng-a.lng) * rad;
  const x = Math.sin(dp/2)**2 +
    Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
  return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

function area(points) {
  if (points.length < 3) return 0;
  const lat0 = points.reduce((s,p)=>s+p.lat,0)/points.length;
  const R = 6371000;
  const rad = Math.PI/180;
  const xy = points.map(p=>({
    x: R*p.lng*rad*Math.cos(lat0*rad),
    y: R*p.lat*rad
  }));
  let sum = 0;
  for(let i=0;i<xy.length;i++){
    const j=(i+1)%xy.length;
    sum += xy[i].x*xy[j].y-xy[j].x*xy[i].y;
  }
  return Math.abs(sum/2);
}

function updateStats() {
  $("distance").textContent = Math.round(totalDistance)+" m";
  $("area").textContent = Math.round(currentArea).toLocaleString()+" ㎡";
}

function drawRoute() {
  const points = route.map(p=>[p.lat,p.lng]);
  if(routeLine) map.removeLayer(routeLine);
  if(points.length>=2){
    routeLine=L.polyline(points,{
      color:"#a6ef39",weight:5
    }).addTo(map);
  }
}

function updatePosition(position) {
  const lat=position.coords.latitude;
  const lng=position.coords.longitude;
  const accuracy=position.coords.accuracy;
  const current={lat,lng};

  $("gpsStatus").textContent="GPS 接続中";

  if(!marker){
    marker=L.circleMarker([lat,lng],{
      radius:8,color:"#fff",weight:3,
      fillColor:"#258cff",fillOpacity:1
    }).addTo(map);

    accuracyCircle=L.circle([lat,lng],{
      radius:accuracy,color:"#258cff",
      fillColor:"#258cff",fillOpacity:.08
    }).addTo(map);

    map.setView([lat,lng],17);
  } else {
    marker.setLatLng([lat,lng]);
    accuracyCircle.setLatLng([lat,lng]);
    accuracyCircle.setRadius(accuracy);
  }

  if(!recording) return;

  if(accuracy>MAX_ACCURACY){
    message("GPS精度が低いため記録を保留しています");
    return;
  }

  if(route.length===0){
    route.push(current);
    drawRoute();
    return;
  }

  const previous=route[route.length-1];
  const moved=distance(previous,current);

  if(moved<3) return;

  if(moved>100){
    message("位置情報の急な変化を検出しました");
    return;
  }

  route.push(current);
  totalDistance+=moved;
  drawRoute();
  updateStats();
  message("歩行ルートを記録中です");
}

function stopGPS() {
  if(watchId!==null){
    navigator.geolocation.clearWatch(watchId);
    watchId=null;
  }
  recording=false;
  $("startButton").disabled=false;
  $("finishButton").disabled=true;
}

$("startButton").addEventListener("click",()=>{
  if(!navigator.geolocation){
    message("このブラウザはGPSに対応していません");
    return;
  }
  if(recording) return;

  route=[];
  totalDistance=0;
  currentArea=0;
  closed=false;

  if(routeLine) map.removeLayer(routeLine);
  if(territoryLayer) map.removeLayer(territoryLayer);

  territoryLayer=null;
  updateStats();
  $("claimButton").disabled=true;
  $("startButton").disabled=true;
  $("finishButton").disabled=false;
  recording=true;

  message("GPSで歩行ルートを記録しています");

  watchId=navigator.geolocation.watchPosition(
    updatePosition,
    error=>{
      message("GPSエラー: "+error.message);
      $("gpsStatus").textContent="GPS エラー";
    },
    {
      enableHighAccuracy:true,
      maximumAge:0,
      timeout:15000
    }
  );
});

$("finishButton").addEventListener("click",()=>{
  if(!recording) return;

  if(route.length<MIN_POINTS ||
     totalDistance<MIN_DISTANCE){
    stopGPS();
    message("距離または記録点が不足しています。もう一度試してください");
    return;
  }

  const gap=distance(route[0],route[route.length-1]);

  if(gap>CLOSE_DISTANCE){
    stopGPS();
    message("スタート地点から40m以内に戻っていません。今回は獲得できません");
    return;
  }

  closed=true;
  stopGPS();

  currentArea=area(route);
  updateStats();

  const polygonPoints=route.map(p=>[p.lat,p.lng]);
  polygonPoints.push(polygonPoints[0]);

  territoryLayer=L.polygon(polygonPoints,{
    color:"#a6ef39",
    weight:3,
    fillColor:"#a6ef39",
    fillOpacity:.25
  }).addTo(map);

  map.fitBounds(territoryLayer.getBounds(),{
    padding:[30,30]
  });

  $("claimButton").disabled=false;
  message("一周完了！領土を獲得できます");
});

$("claimButton").addEventListener("click",()=>{
  if(!closed || route.length<MIN_POINTS) return;

  territoryCount++;
  $("territories").textContent=territoryCount;
  $("claimButton").disabled=true;
  message("領土を獲得しました！");
});

if(navigator.geolocation){
  navigator.geolocation.getCurrentPosition(
    updatePosition,
    error=>{
      $("gpsStatus").textContent="GPS 未接続";
      message("位置情報を許可してください");
    },
    {
      enableHighAccuracy:true,
      timeout:15000,
      maximumAge:0
    }
  );
}
</script>
</body>
</html>
